<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display TV Pro + Petugas - Masjid Baitul Quddus Cungking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emeraldBrand: '#065f46',
                        amberBrand: '#f59e0b'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 35s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-white overflow-hidden font-sans h-screen flex flex-col justify-between transition-colors duration-500">

    <!-- Header Masjid & Waktu -->
    <header class="bg-emerald-800 dark:bg-emerald-950 px-8 py-3 flex justify-between items-center border-b-4 border-amber-400 shadow-xl">
        <div class="flex items-center space-x-4">
            <div class="bg-amber-400 text-slate-950 p-2.5 rounded-xl font-black text-2xl shadow-inner">MQ</div>
            <div>
                <h1 class="text-2xl font-extrabold tracking-wider text-amber-300">MASJID BAITUL QUDDUS</h1>
                <p class="text-emerald-100 text-xs font-medium">Cungking, Kelurahan Penataban, Kec. Giri, Banyuwangi</p>
            </div>
        </div>
        <div class="text-right flex items-center gap-6">
            <div>
                <div id="clock" class="text-3xl font-mono font-black text-white tracking-widest drop-shadow">00:00:00</div>
                <div id="date" class="text-emerald-200 text-xs font-semibold mt-0.5">Memuat Tanggal...</div>
            </div>
            <button onclick="toggleThemeManually()" class="bg-slate-800/60 dark:bg-slate-800 p-2 rounded-full text-amber-400 border border-slate-700" title="Ubah Tema">
                <span id="themeIcon" class="text-lg">🌙</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-5 grid grid-cols-12 gap-5 overflow-hidden">
        
        <!-- Kolom Kiri: Keuangan & Mutasi (4 Kolom) -->
        <div class="col-span-4 flex flex-col gap-3 justify-between">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-lg">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400">TOTAL SALDO KAS</span>
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                </div>
                <h2 id="saldoTotal" class="text-2xl font-black text-emerald-600 dark:text-amber-400 tracking-tight">Rp 0</h2>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-3 shadow">
                    <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400 block mb-1">PEMASUKAN BULAN INI</span>
                    <h3 id="pemasukan" class="text-base font-bold text-emerald-600 dark:text-emerald-400">Rp 0</h3>
                </div>
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-3 shadow">
                    <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400 block mb-1">PENGELUARAN BULAN INI</span>
                    <h3 id="pengeluaran" class="text-base font-bold text-rose-600 dark:text-rose-400">Rp 0</h3>
                </div>
            </div>

            <!-- Mutasi Kas Terbaru -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-lg flex-1 flex flex-col justify-between">
                <div>
                    <h3 class="text-xs font-bold text-emerald-700 dark:text-emerald-400 uppercase tracking-wider border-b border-slate-200 dark:border-slate-800 pb-2 mb-2">Mutasi Kas Terbaru</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <tbody id="txTable" class="divide-y divide-slate-100 dark:divide
