<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrator - Masjid Baitul Quddus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-950 p-8 rounded-2xl shadow-2xl border border-slate-800">
        <div class="text-center mb-6">
            <div class="bg-emerald-600/20 text-emerald-400 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-emerald-500/30">
                <i data-lucide="shield-check" class="w-7 h-7"></i>
            </div>
            <h2 class="text-xl font-extrabold text-amber-400">Login Admin Masjid</h2>
            <p class="text-xs text-slate-400 mt-1">Masjid Baitul Quddus Cungking, Mojopanggung</p>
        </div>

        <form onsubmit="processLogin(event)" class="space-y-4 text-sm">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
                <input type="text" id="user" required placeholder="admin" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 outline-none focus:border-emerald-500 text-white">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                <input type="password" id="pass" required placeholder="masjid123" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 outline-none focus:border-emerald-500 text-white">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg">Masuk ke Panel</button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-800 text-center text-xs text-slate-500 flex justify-between items-center">
            <a href="index.html" class="hover:text-emerald-400 transition">&larr; Beranda Utama</a>
            <a href="tv.html" class="hover:text-amber-400 transition">Buka TV &rarr;</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });

        function processLogin(e) {
            e.preventDefault();
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;

            // Kredensial default
            if(u === 'admin' && p === 'masjid123') {
                sessionStorage.setItem('isAdminAuth', 'true');
                window.location.href = 'admin.html';
            } else {
                alert('Username atau Password salah! (Default: admin / masjid123)');
            }
        }
    </script>
</body>
</html>
